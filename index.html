<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ラスベガス">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>ラスベガス｜4人ゴルフ ペアゲーム</title>
  
  <style>
    :root{
      --bg:#eef9ef;
      --card:#ffffff;
      --line:#cfe3d3;
      --text:#183326;
      --muted:#688072;
      --green:#087a46;
      --green-dark:#075f38;
      --green2:#e7f7eb;
      --lime:#b9e65d;
      --yellow:#ffd94a;
      --red:#b3261e;
      --shadow:0 10px 28px rgba(19,91,52,.10);
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:
        radial-gradient(circle at 18% 4%, rgba(185,230,93,.26), transparent 24%),
        linear-gradient(180deg,#dff4ff 0 150px,#eef9ef 150px 100%);
    }
    .app{max-width:1180px;margin:auto;padding:12px 12px 40px}
    .hero{
      position:relative;overflow:hidden;
      background:linear-gradient(135deg,#0a8a4f,#06663b 70%);
      color:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:12px;
      box-shadow:0 12px 30px rgba(6,102,59,.22);
    }
    .hero:before{
      content:"";position:absolute;left:-8%;right:-8%;bottom:-44px;height:100px;
      border-radius:50%;background:linear-gradient(180deg,#7fd05d,#4caf50);
      opacity:.95;
    }
    .hero:after{
      content:"⛳";position:absolute;right:18px;bottom:8px;font-size:62px;
      filter:drop-shadow(0 4px 7px rgba(0,0,0,.13));transform:rotate(-4deg)
    }
    .hero-inner{position:relative;z-index:2;display:flex;align-items:center;gap:12px}
    .ball{
      width:54px;height:54px;border-radius:50%;background:#fff;flex:0 0 auto;
      box-shadow:inset -8px -8px 14px rgba(0,0,0,.08),0 5px 10px rgba(0,0,0,.15);
      position:relative;
    }
    .ball:before{
      content:"";position:absolute;inset:8px;border-radius:50%;
      background:
        radial-gradient(circle at 8px 8px,#d8ddd8 0 2px,transparent 2.4px),
        radial-gradient(circle at 22px 11px,#d8ddd8 0 2px,transparent 2.4px),
        radial-gradient(circle at 14px 26px,#d8ddd8 0 2px,transparent 2.4px),
        radial-gradient(circle at 30px 27px,#d8ddd8 0 2px,transparent 2.4px);
    }
    .hero h1{font-size:25px;margin:0;letter-spacing:.04em}
    .hero p{margin:3px 0 0;font-size:12px;opacity:.9}
    .card{
      background:rgba(255,255,255,.97);border:1px solid var(--line);
      border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px
    }
    h1{font-size:22px;margin:0 0 10px}
    h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
    h2:before{content:"";width:7px;height:22px;border-radius:5px;background:linear-gradient(var(--green),var(--lime))}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .namebox>div{background:#f6fbf7;border:1px solid #deebe0;border-radius:14px;padding:8px}
    .namebox label{font-size:12px;color:var(--green-dark);font-weight:800;display:block;margin-bottom:4px}
    input,select,button{font:inherit}
    input[type="text"],input[type="number"],select{
      width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px;
      outline:none;transition:.18s
    }
    input:focus,select:focus{border-color:#69b97d;box-shadow:0 0 0 3px rgba(105,185,125,.16)}
    .mode{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .mode label{
      background:#eff9f2;border:1px solid #c9e4d0;border-radius:999px;padding:8px 12px;
      font-weight:700;color:#145b37
    }
    .note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px}
    table{border-collapse:collapse;min-width:1120px;width:100%;background:#fff}
    th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
    th{
      background:linear-gradient(180deg,#0c814b,#096d40);color:#fff;
      font-size:12px;position:sticky;top:0;z-index:3
    }
    th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#f2faf4;font-weight:800}
    th:first-child{z-index:4;background:#075f38;color:#fff}
    tbody tr:nth-child(even) td:not(:first-child){background:#fbfefb}
    td.score input{width:62px;text-align:center;padding:8px 4px}
    td.point input{width:60px;text-align:center;padding:8px 3px;font-weight:800}
    .point-entry{display:flex;align-items:center;justify-content:center;gap:4px;min-width:148px}
    .sign-button{padding:8px 9px;border:1px solid #b4d7be;background:#f1f8f2;color:#075f38;border-radius:9px;font-weight:900;box-shadow:none;min-width:38px}
    .sign-button.negative{background:#fff0ec;color:#a72720;border-color:#f2c4bb}
    .sign-button:focus-visible{outline:2px solid #087a46;outline-offset:2px}
    .pair{font-weight:800;min-width:160px;color:#155d39}
    .rank{font-size:11px;min-width:210px;text-align:left;line-height:1.5}
    .outrow td{background:#e8f5ea!important;font-weight:800;color:#145b37}
    .repeat-head td{background:#0b7545!important;color:white!important;font-size:12px;font-weight:800}
    .repeat-head td:first-child{background:#075f38!important;color:white!important}
    .pair-override{display:block;margin-top:5px;max-width:220px;width:100%;font-size:12px;padding:6px}
    .override-label{font-size:11px;color:#b35b15;margin-top:3px}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .sumcard{
      border:1px solid #cae4d0;border-radius:16px;padding:12px;text-align:center;
      background:linear-gradient(180deg,#fff,#f1faf3)
    }
    .sumname{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sumval{font-size:27px;font-weight:900;margin-top:3px;color:var(--green-dark)}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    button{
      border:0;border-radius:12px;padding:11px 15px;font-weight:800;
      box-shadow:0 4px 10px rgba(0,0,0,.05)
    }
    .primary{background:linear-gradient(180deg,#0b8b50,#076b40);color:#fff}
    .secondary{background:#eef1ee;color:var(--text)}
    .danger{background:#fff1f0;color:var(--red);border:1px solid #f2d0cd}
    .status{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
    .nextbox{
      background:linear-gradient(135deg,#ebf9ee,#f7fff4);border:1px solid #b9dec4;
      border-radius:14px;padding:11px;margin-top:10px;font-size:14px
    }
    .nextbox strong{color:#096d40}
    .goods-ad{margin-top:14px}
    .goods-ad-card{
      background:#fff;border:1px solid var(--line);border-radius:20px;
      box-shadow:var(--shadow);padding:10px;overflow:hidden
    }
    .goods-ad-link{display:block;text-decoration:none;color:inherit}
    .goods-ad-img{display:block;width:100%;height:auto;border-radius:14px}
    .goods-ad-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .goods-ad-actions a{
      flex:1;min-width:220px;text-align:center;text-decoration:none;border-radius:12px;
      padding:12px 14px;font-weight:900
    }
    .goods-site-btn{background:#086e40;color:#fff}
    .goods-line-btn{background:#06c755;color:#fff}
    .goods-ad-note{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
    .footer-grass{
      text-align:center;color:#2c6c43;font-size:12px;padding:6px 0 4px
    }
    @media(max-width:700px){
      body{background:linear-gradient(180deg,#dff4ff 0 130px,#eef9ef 130px 100%)}
      .grid4,.summary{grid-template-columns:repeat(2,1fr)}
      .app{padding-left:8px;padding-right:8px}
      .card{padding:10px;border-radius:16px}
      .hero{border-radius:19px;padding:14px}
      .hero h1{font-size:22px}
      .ball{width:46px;height:46px}
      h1{font-size:20px}
      .status{width:100%;margin-left:0}
      .goods-ad-actions a{min-width:0}
    }
  </style>

</head>
<body>
<div class="app">
  <div class="hero">
    <div class="hero-inner">
      <div class="ball" aria-hidden="true"></div>
      <div>
        <h1>ラスベガス</h1>
        <p>4人で楽しむ ゴルフ・ペアゲーム ⛳</p>
      </div>
    </div>
  </div>
  <div class="card">
    <h2>プレイヤー設定</h2>
    <div class="grid4 namebox">
      <div><label>くじ1番</label><input id="name0" type="text"></div>
      <div><label>くじ2番</label><input id="name1" type="text"></div>
      <div><label>くじ3番</label><input id="name2" type="text"></div>
      <div><label>くじ4番</label><input id="name3" type="text"></div>
    </div>
    <div class="mode">
      <label><input type="radio" name="mode" value="rule"> 規則モード</label>
      <label><input type="radio" name="mode" value="manual"> 任意モード</label>
    </div>
    <div class="note">規則モードでも各ホールの「ペアA」欄から組み合わせを手動変更できます。「自動（規則どおり）」で元に戻せます。次ホールの順位は直前ホールのスコア順。同点ならその前のホール、さらに同点ならさらに前へ遡り、最後まで同じなら最初のくじ順で決めます。</div>
    <div id="nextPair" class="nextbox"></div>
  </div>

  <div class="card">
    <h2>18ホール スコアカード</h2>
    <div class="scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>ゲーム得点 累計</h2>
    <div id="gameTotals" class="summary"></div>
  </div>

  <div class="card">
    <h2>実スコア 合計</h2>
    <div id="strokeTotals" class="summary"></div>
  </div>

  <div class="goods-ad goods-ad-card" aria-label="GOODS MONSTER 広告">
    <a class="goods-ad-link" href="https://originalgoods-maker.com/" target="_blank" rel="noopener noreferrer" aria-label="グッズモンスター ノベルティ公式サイトを開く">
      <img class="goods-ad-img" src="./goods-monster-banner.png" alt="GOODS MONSTER グッズモンスター ノベルティ オリジナルグッズ・ゴルフコンペ記念品">
    </a>
    <div class="goods-ad-actions">
      <a class="goods-site-btn" href="https://originalgoods-maker.com/" target="_blank" rel="noopener noreferrer">グッズモンスター　ノベルティ</a>
      <a class="goods-line-btn" href="https://line.me/ti/p/ku4gIIrtGE" target="_blank" rel="noopener noreferrer">LINEで問い合わせ</a>
    </div>
    <div class="goods-ad-note">株式会社リオントレーディングジャパン　TEL 078-382-1581</div>
  </div>

  <div class="card toolbar">
    <button id="saveBtn" class="primary">保存</button>
    <button id="newBtn" class="danger">新しいラウンド</button>
    <span id="saveStatus" class="status">自動保存 ON</span>
  </div>
</div>
<div class="footer-grass">⛳ Nice Shot!　今日も楽しくラウンド！</div>

<script>
(() => {
  const KEY = 'golf_pair_pwa_v1';
  const defaultState = () => ({
    mode:'rule',
    names:['プレイヤー1','プレイヤー2','プレイヤー3','プレイヤー4'],
    holes:Array.from({length:18},()=>({strokes:['','','',''],point:'',manualPair:0,ruleOverride:null}))
  });

  let state = load();

  const patterns = [
    [[0,1],[2,3]],
    [[0,2],[1,3]],
    [[0,3],[1,2]]
  ];

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      const s = JSON.parse(raw);
      if(!s || !Array.isArray(s.holes) || s.holes.length!==18) return defaultState();
      return s;
    }catch(e){ return defaultState(); }
  }

  function save(show=false){
    localStorage.setItem(KEY, JSON.stringify(state));
    if(show){
      const el=document.getElementById('saveStatus');
      el.textContent='保存しました';
      setTimeout(()=>el.textContent='自動保存 ON',1200);
    }
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function validScore(h,p){
    const raw=state.holes[h].strokes[p];
    if(raw==='' || raw===null || raw===undefined) return null;
    const n=Number(raw);
    return Number.isFinite(n)?n:null;
  }

  function comparePlayers(a,b,lastHole){
    for(let h=lastHole; h>=0; h--){
      const sa=validScore(h,a), sb=validScore(h,b);
      if(sa===null || sb===null) continue;
      if(sa!==sb) return sa-sb;
    }
    return a-b; // 最初のくじ順
  }

  function rankingForHole(h){
    if(h===0) return [0,1,2,3];
    return [0,1,2,3].sort((a,b)=>comparePlayers(a,b,h-1));
  }

  function teamsForHole(h){
    if(state.mode==='rule' && Number.isInteger(state.holes[h].ruleOverride) && state.holes[h].ruleOverride>=0 && state.holes[h].ruleOverride<6){
      const index=state.holes[h].ruleOverride;
      const pair=patterns[index%3];
      return index<3 ? pair : [pair[1],pair[0]];
    }
    if(state.mode==='manual') return patterns[state.holes[h].manualPair];
    const order=rankingForHole(h);
    const pat=patterns[h%3];
    return [pat[0].map(i=>order[i]), pat[1].map(i=>order[i])];
  }

  function pairName(pair){
    return pair.map(i=>state.names[i] || `プレイヤー${i+1}`).join(' ＋ ');
  }

  function fmtPoint(n){
    if(!Number.isFinite(n)) n=0;
    return n>0 ? '+'+n : String(n);
  }

  function nextRankingAfter(h){
    if(h<0) return [0,1,2,3];
    return [0,1,2,3].sort((a,b)=>comparePlayers(a,b,h));
  }

  function completeHole(h){
    return [0,1,2,3].every(p=>validScore(h,p)!==null);
  }

  function manualOptions(selected){
    return patterns.map((p,i)=>{
      const a=pairName(p[0]), b=pairName(p[1]);
      return `<option value="${i}" ${i===selected?'selected':''}>${esc(a)} vs ${esc(b)}</option>`;
    }).join('');
  }

  function ruleOptions(selected){
    const opts=['<option value="auto">自動（規則どおり）</option>'];
    for(let i=0;i<6;i++){
      const pair=patterns[i%3];
      const t=i<3?pair:[pair[1],pair[0]];
      opts.push(`<option value="${i}" ${selected===i?'selected':''}>A: ${esc(pairName(t[0]))} ／ B: ${esc(pairName(t[1]))}</option>`);
    }
    if(selected===null || selected===undefined) opts[0]='<option value="auto" selected>自動（規則どおり）</option>';
    return opts.join('');
  }

  function repeatedNamesRow(){
    return `<tr class="repeat-head"><td>IN</td>${state.names.map(n=>`<td>${esc(n)}</td>`).join('')}<td>次順位</td><td>ペアA</td><td>A得点</td><td>ペアB</td><td>B得点</td></tr>`;
  }

  function renderHeader(){
    document.getElementById('thead').innerHTML = `
      <tr>
        <th>H</th>
        ${state.names.map(n=>`<th>${esc(n || '')}</th>`).join('')}
        <th>次順位</th>
        <th>ペアA</th>
        <th>A得点</th>
        <th>ペアB</th>
        <th>B得点</th>
      </tr>`;
  }

  function renderRows(){
    let html='';
    for(let h=0; h<18; h++){
      if(h===9) html += repeatedNamesRow();
      const teams=teamsForHole(h);
      const pRaw=state.holes[h].point;
      const p = pRaw==='' ? 0 : Number(pRaw)||0;
      const next = h===17 ? '終了' :
        (completeHole(h)
          ? nextRankingAfter(h).map((pl,i)=>`${i+1}:${state.names[pl]}`).join(' / ')
          : 'スコア入力後に確定');

      html += `<tr>
        <td>${h+1}</td>
        ${[0,1,2,3].map(pl=>`
          <td class="score"><input type="number" inputmode="numeric" min="1" max="30"
            data-kind="score" data-hole="${h}" data-player="${pl}" value="${esc(state.holes[h].strokes[pl])}" placeholder="-"></td>
        `).join('')}
        <td class="rank">${esc(next)}</td>
        <td class="pair">
          ${esc(pairName(teams[0]))}
          ${state.mode==='manual' ? `<div style="margin-top:5px"><select class="pair-override" data-kind="manual" data-hole="${h}">${manualOptions(state.holes[h].manualPair)}</select></div>` : `<select class="pair-override" aria-label="${h+1}ホールのペアを変更" data-kind="rule-override" data-hole="${h}">${ruleOptions(state.holes[h].ruleOverride)}</select>${Number.isInteger(state.holes[h].ruleOverride)?'<div class="override-label">手動変更中（自動に戻せます）</div>':''}`}
        </td>
        <td class="point"><div class="point-entry">
          <button type="button" class="sign-button ${state.holes[h].pointSign===-1 || Number(pRaw)<0?'negative':''}" data-kind="sign" data-hole="${h}" aria-label="ペアAの得点のプラス・マイナスを切り替える">${state.holes[h].pointSign===-1 || Number(pRaw)<0?'−':'＋'}</button>
          <input type="number" inputmode="numeric" min="0" step="1" aria-label="ペアAの得点（数字のみ）" data-kind="point" data-hole="${h}" value="${pRaw===''?'':Math.abs(Number(pRaw)||0)}" placeholder="0">
          </div></td>
        <td class="pair">${esc(pairName(teams[1]))}</td>
        <td><strong>${fmtPoint(-p)}</strong></td>
      </tr>`;

      if(h===8){
        html += `<tr class="outrow"><td>OUT</td><td colspan="9">前半9H</td></tr>`;
      }
    }
    document.getElementById('tbody').innerHTML=html;
  }

  function totals(){
    const game=[0,0,0,0];
    const strokes=[0,0,0,0];
    for(let h=0; h<18; h++){
      for(let p=0;p<4;p++){
        const s=validScore(h,p);
        if(s!==null) strokes[p]+=s;
      }
      const raw=state.holes[h].point;
      const v=raw==='' ? 0 : Number(raw)||0;
      const tm=teamsForHole(h);
      tm[0].forEach(p=>game[p]+=v);
      tm[1].forEach(p=>game[p]-=v);
    }
    return {game,strokes};
  }

  function renderTotals(){
    const {game,strokes}=totals();
    document.getElementById('gameTotals').innerHTML=state.names.map((n,i)=>`
      <div class="sumcard"><div class="sumname">${esc(n)}</div><div class="sumval">${fmtPoint(game[i])}</div></div>
    `).join('');
    document.getElementById('strokeTotals').innerHTML=state.names.map((n,i)=>`
      <div class="sumcard"><div class="sumname">${esc(n)}</div><div class="sumval">${strokes[i]}</div></div>
    `).join('');
  }

  function renderNextPair(){
    const el=document.getElementById('nextPair');
    if(state.mode==='manual'){
      el.innerHTML='<strong>任意モード：</strong> 各ホールの「ペアA」欄で、そのホールの組み合わせを指定してください。';
      return;
    }
    let target=0;
    for(let h=0; h<18; h++){
      if(!completeHole(h)){ target=h; break; }
      target=Math.min(h+1,17);
    }
    const tm=teamsForHole(target);
    el.innerHTML=`<strong>${target+1}H のペア：</strong> ${esc(pairName(tm[0]))}　vs　${esc(pairName(tm[1]))}`;
  }

  function renderNames(){
    state.names.forEach((n,i)=>{
      const el=document.getElementById('name'+i);
      if(document.activeElement!==el) el.value=n;
    });
    document.querySelectorAll('input[name="mode"]').forEach(r=>r.checked=(r.value===state.mode));
  }

  function render(){
    renderNames();
    renderHeader();
    renderRows();
    renderTotals();
    renderNextPair();
  }

  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id && t.id.startsWith('name')){
      const i=Number(t.id.replace('name',''));
      state.names[i]=t.value || `プレイヤー${i+1}`;
      save();
      renderHeader(); renderRows(); renderTotals(); renderNextPair();
      return;
    }
    const kind=t.dataset.kind;
    if(kind==='score'){
      state.holes[Number(t.dataset.hole)].strokes[Number(t.dataset.player)]=t.value;
      save(); renderRows(); renderTotals(); renderNextPair();
    } else if(kind==='point'){
      const h=Number(t.dataset.hole);
      const old=Number(state.holes[h].point)||0;
      const sign=state.holes[h].pointSign === -1 || old<0 ? -1 : 1;
      state.holes[h].point=t.value===''?'':String(sign*(Math.abs(Number(t.value))||0));
      save(); renderTotals();
      const row=t.closest('tr');
      if(row) row.lastElementChild.querySelector('strong').textContent=fmtPoint(-(Number(state.holes[h].point)||0));
    }
  });

  document.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-kind="sign"]');
    if(!btn) return;
    const h=Number(btn.dataset.hole);
    const entry=state.holes[h];
    const sign=entry.pointSign===-1 || Number(entry.point)<0 ? -1 : 1;
    entry.pointSign=-sign;
    if(entry.point!=='') entry.point=String((Math.abs(Number(entry.point))||0)*entry.pointSign);
    save(); renderRows(); renderTotals();
  });

  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.name==='mode'){
      state.mode=t.value;
      save(); render();
    } else if(t.dataset.kind==='manual'){
      state.holes[Number(t.dataset.hole)].manualPair=Number(t.value);
      save(); renderRows(); renderTotals();
    } else if(t.dataset.kind==='rule-override'){
      const h=Number(t.dataset.hole);
      state.holes[h].ruleOverride=t.value==='auto'?null:Number(t.value);
      save(); renderRows(); renderTotals(); renderNextPair();
    }
  });

  document.getElementById('saveBtn').addEventListener('click',()=>save(true));
  document.getElementById('newBtn').addEventListener('click',()=>{
    if(confirm('現在の入力内容を消して、新しいラウンドを開始しますか？')){
      state=defaultState(); save(); render();
    }
  });

  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
